name: Publier educooo.com

# Le site est généré puis déployé à chaque poussée sur main. Rien à lancer à la
# main : c'est la condition posée quand on a décidé de ne plus dépendre d'un
# accès manuel comme du temps de Lovable.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Générer le site
        run: node scripts/build.mjs
      - name: Vérifier que les pages exigées par les stores existent
        run: |
          for page in confidentialite conditions suppression-compte support mentions-legales; do
            test -s "dist/$page/index.html" || { echo "MANQUANT : dist/$page/index.html"; exit 1; }
          done
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -s dist/CNAME
          echo "Toutes les pages attendues sont présentes."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
