<script>

inspiration, guide-moi"},{"slug":"programme-filtres","titre":"Comment voir tout le programme par domaine (et les 4 filtres)","accroche":"Vois ton programme domaine par domaine, et repère en un clic ce qui résiste ou n'a jamais été abordé.","public":"Les deux","mots":"programme, compétences, domaine, filtre, résiste, pas évalué, jamais abordé, couverture, référentiel, socles"},{"slug":"choisir-referentiels","titre":"Comment choisir tes référentiels et préciser tes domaines","accroche":"Dis à EducooO quels référentiels suit ta classe, et écarte les domaines que tu n'enseignes pas.","public":"Les deux","mots":"référentiel, socles, programme, réseau, juridiction, domaine, enseigné, cycle, choisir, paramétrer"},{"slug":"multi-classes","titre":"Comment gérer plusieurs classes au même endroit","accroche":"Mi-temps, plusieurs niveaux ? Affiche toutes tes classes et bascule de l'une à l'autre d'un geste.","public":"Les deux","mots":"plusieurs classes, multi-classes, co-enseignement, mi-temps, basculer, sélecteur de classe, agrégé, collègue"},{"slug":"copier-lecon-classe","titre":"Comment copier une leçon vers une autre de tes classes","accroche":"Écris ta leçon une fois, copie-la dans ton autre classe en un geste.","public":"Les deux","mots":"copier, leçon, autre classe, dupliquer, mi-temps, deux classes, programme, rentrée"},{"slug":"absence-replanifier","titre":"Comment gérer une absence et replanifier tes leçons","accroche":"Un imprévu ? Récupère ta journée planifiée et repose les leçons plus tard, sans tout refaire.","public":"Les deux","mots":"absence, absent, malade, reporter, replanifier, récupérer, décaler, imprévu, journée"},{"slug":"fiche-eleve","titre":"Comment suivre un élève et obtenir sa synthèse","accroche":"Toutes tes observations d'un enfant, résumées en forces, points d'appui et pistes. Prêt pour le bulletin ou la réunion.","public":"Les deux","mots":"élève, fiche, synthèse, résumé, bulletin, réunion de parents, besoins, forces, points d'appui, constats"},{"slug":"collegues-partage","titre":"Comment ajouter des collègues et partager une leçon","accroche":"Scanne le code d'un·e collègue et échangez vos leçons. Ce qui est repris reste visible.","public":"Les deux","mots":"collègue, partage, partager, leçon, QR code, envoyer, recevoir, repris, équipe, groupe"},{"slug":"parrainage","titre":"Comment parrainer un·e collègue","accroche":"Partage ton lien ou ton code : tes filleul·es en profitent, et toi aussi.","public":"Les deux","mots":"parrainage, parrainer, filleul, lien, code, QR, inviter, recommander, manne"},{"slug":"abonnement","titre":"Comment gérer ton abonnement EducooO GO!","accroche":"Vois ce qu'il te reste d'essai et abonne-toi en deux touches, sans surprise.","public":"Les deux","mots":"abonnement, prix, tarif, s'abonner, essai, gratuit, GO, payer, résiliation, facture"},{"slug":"donnees-confiance","titre":"Comment EducooO protège les données (et comment exporter ou supprimer)","accroche":"Prénoms masqués, données en Europe, tout exportable. Tu gardes la main, de bout en bout.","public":"Les deux","mots":"données, RGPD, confidentialité, anonymisation, prénom, Europe, exporter, supprimer, compte, vie privée"},{"slug":"export-pdf-semaine","titre":"Comment exporter ta semaine en PDF (sur ordinateur)","accroche":"Depuis ton navigateur, transforme la semaine affichée en PDF, prête à imprimer ou à partager.","public":"Les deux","mots":"PDF, exporter, imprimer, semaine, semainier, ordinateur, web, partager, direction"},{"slug":"pilotage","titre":"Comment piloter ton programme (aborder, consolider, valider)","accroche":"Ton tableau de bord te montre ce qui est lancé, ce qui se consolide, ce qui résiste. Et tu lances une leçon directement.","public":"Les deux","mots":"pilotage, tableau de bord, aborder, consolider, valider, résiste, couverture, programme, avancement, année"}];
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const liste=document.getElementById("liste"),compte=document.getElementById("compte"),vide=document.getElementById("vide"),q=document.getElementById("q");
const tagClass=p=>p==="Maternelle"?"mat":p==="Primaire"?"pri":"";
function surligne(t,m){let o=t;for(const w of m){if(w.length<2)continue;o=o.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");}return o;}
function rendre(){
  const brut=q.value.trim();
  const termes=norm(brut).split(/\s+/).filter(Boolean);
  const res=GUIDES.filter(g=>{const foin=norm([g.titre,g.accroche,g.mots,g.public].join(" "));return termes.every(t=>foin.includes(t));});
  liste.innerHTML=res.map(g=>'<a class="g-carte" href="/guides/'+g.slug+'/"><h3>'+surligne(g.titre,termes)+'</h3><p>'+surligne(g.accroche||"",termes)+'</p><span class="g-tag '+tagClass(g.public)+'">'+g.public+'</span></a>').join("");
  compte.textContent=brut?res.length+" guide"+(res.length>1?"s":"")+" pour « "+brut+" »":GUIDES.length+" guides";
  vide.hidden=res.length>0;
}
q.addEventListener("input",rendre);rendre();
</script>
